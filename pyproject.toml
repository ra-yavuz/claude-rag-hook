[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-rag-hook"
version = "0.1.0"
description = "Keyword-triggered local RAG hook for Claude Code. Type 'rag: <question>' and the hook prepends retrieved chunks from a local index before Claude sees the prompt."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ramazan Yavuz", email = "yavuzramazan1994@gmail.com" }]
keywords = [
    "claude",
    "claude-code",
    "rag",
    "retrieval-augmented-generation",
    "embeddings",
    "vector-search",
    "lancedb",
    "fastembed",
    "local-first",
    "anthropic",
    "hook",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pathspec>=0.11",
    "lancedb>=0.6",
    "pyarrow>=14",
]

[project.optional-dependencies]
fastembed = ["fastembed>=0.3"]
http = ["httpx>=0.25"]

[project.scripts]
claude-rag-hook = "claude_rag_hook.cli:main"
claude-rag-hookd = "claude_rag_hook.daemon:main"

[project.urls]
Homepage = "https://ra-yavuz.github.io/claude-rag-hook/"
Source = "https://github.com/ra-yavuz/claude-rag-hook"
Releases = "https://github.com/ra-yavuz/claude-rag-hook/releases"
Issues = "https://github.com/ra-yavuz/claude-rag-hook/issues"

[tool.setuptools]
package-dir = { "" = "lib" }

[tool.setuptools.packages.find]
where = ["lib"]
include = ["claude_rag_hook*"]
